<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

<title>Карусель — справа → влево</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    font-family:'Inter',system-ui,sans-serif;
}

/* ---------------- FRAME ---------------- */

.frame{
    position:relative;
    border-radius:56px;
    padding:36px 32px 48px;
    max-width:1200px;
    min-height:800px;
    width:100%;
    overflow:hidden;
    box-shadow:0 30px 48px rgba(0,0,0,0.18);
    background:transparent;
}

/* ЧИСТЫЙ ФОН БЕЗ ДЫМКИ */

.frame::before{
    content:"";
    position:absolute;
    inset:0;
    background:url('fon_alif.png') center/cover no-repeat;
    z-index:0;
}

/* ВАЖНО:
   УДАЛЕН .frame::after
   ИМЕННО ОН ДАВАЛ БЕЛУЮ ПЛЕНКУ
*/

.frame > *{
    position:relative;
    z-index:1;
}

/* ---------------- CAROUSEL ---------------- */

.carousel-container{
    overflow:visible;
    margin:0 auto;
    border-radius:48px;
    padding:16px 0 32px 0;
    min-height:380px;
}

.carousel-track{
    display:flex;
    gap:28px;
    align-items:flex-start;
    justify-content:flex-end;
    transition:transform 0.6s cubic-bezier(0.25,0.92,0.4,1.05);
}

.carousel-item{
    position:relative;
    flex-shrink:0;
    border-radius:28px;
    overflow:visible;
    background:white;
    box-shadow:0 20px 30px -10px rgba(0,0,0,0.15);
}

.carousel-item img.main-img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border-radius:28px;
}

/* ---------------- TAG ---------------- */

.tag{
    position:absolute;
    top:-15%;
    left:-15%;
    width:35%;
    height:auto;
    z-index:10;
    pointer-events:none;
    transform:rotate(18deg);
}

/* ---------------- PANEL ---------------- */

.action-panel{
    margin-top:300px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;

    /* УБРАНА ДЫМКА */
    background:transparent;
    backdrop-filter:none;

    padding:16px 24px;
    border-radius:100px;
}

/* ---------------- INPUT ---------------- */

.email-input-group{
    display:flex;
    align-items:center;

    background:#ffffff;

    border-radius:60px;
    padding:4px 24px;
    border:1px solid #e2e8f0;

    flex:1;
    min-width:240px;
}

.email-input-group input{
    border:none;
    outline:none;
    padding:12px 0;
    width:100%;
    background:transparent;
    font-size:16px;
}

/* ---------------- BUTTON ---------------- */

.buy-button{
    background:linear-gradient(115deg,#fbbf24,#f59e0b);
    border:none;
    padding:12px 32px;
    border-radius:60px;
    font-weight:700;
    cursor:pointer;
    font-size:16px;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:768px){

    .frame{
        min-height:700px;
        padding:24px 18px 36px;
        border-radius:32px;
    }

    .carousel-track{
        gap:18px;
    }

    .action-panel{
        margin-top:180px;
        flex-direction:column;
        align-items:stretch;
    }

    .buy-button{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="frame">

    <div class="carousel-container">
        <div class="carousel-track" id="track"></div>
    </div>

    <div class="action-panel">

        <div class="email-input-group">
            <input
                type="email"
                id="emailInput"
                placeholder="Ваш e-mail"
            >
        </div>

        <button
            class="buy-button"
            id="buyBtn"
        >
            КУПИТЬ 1500₽
        </button>

    </div>

</div>

<script>

const images = [
    "bug.png",
    "tufli.png",
    "remeni.png",
    "palito.png",
    "platie.png",
    "ochki.png",
    "braslet.png",
    "kofta.png",
    "shuba.png",
    "tik-tak.png"
];

const track = document.getElementById("track");

/* СОЗДАНИЕ ЭЛЕМЕНТОВ */

images.forEach(src => {

    const div = document.createElement("div");

    div.className = "carousel-item";

    div.innerHTML = `
        <img src="${src}" class="main-img">
        <img src="birka.png" class="tag">
    `;

    track.appendChild(div);

});

/* ---------------- РАЗМЕРЫ ---------------- */

function updateStyles(){

    const items = [...track.children];

    items.forEach((item, i) => {

        const fromRight = items.length - 1 - i;

        if(fromRight < 3){

            item.style.width = "140px";
            item.style.height = "160px";
            item.style.opacity = "1";

        }

        else if(fromRight === 3){

            item.style.width = "118px";
            item.style.height = "135px";
            item.style.opacity = "0.85";

        }

        else{

            item.style.width = "90px";
            item.style.height = "110px";
            item.style.opacity = "0.6";

        }

    });

}

updateStyles();

/* ---------------- ДВИЖЕНИЕ ---------------- */

let anim = false;

function moveLeft(){

    if(anim) return;

    anim = true;

    const first = track.firstElementChild;

    const w = first.offsetWidth + 28;

    track.style.transform = `translateX(-${w}px)`;

    setTimeout(()=>{

        track.style.transition = "none";

        track.appendChild(first);

        track.style.transform = "translateX(0)";

        track.offsetHeight;

        track.style.transition =
            "0.6s cubic-bezier(0.25,0.92,0.4,1.05)";

        updateStyles();

        anim = false;

    },600);

}

setInterval(moveLeft,2000);

/* ---------------- КНОПКА ---------------- */

document.getElementById("buyBtn").onclick = ()=>{

    const email =
        document.getElementById("emailInput").value;

    if(!email){

        alert("Введите email");

    }else{

        alert("Отправлено: " + email);

    }

};

</script>

</body>
</html>
